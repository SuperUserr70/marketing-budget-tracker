<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Spend Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2B39; --paper:#F6F4EF; --card:#FFFFFF;
    --line:#DEDACE; --muted:#6B7280; --good:#3E7A5C; --warn:#C77B32; --bad:#B4483A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2,h3{font-family:'Source Serif 4',serif;margin:0;}
  header{padding:20px 20px 0;}
  header h1{font-size:22px;font-weight:700;}
  header p{color:var(--muted);font-size:13px;margin:4px 0 0;}
  nav{display:flex;gap:4px;padding:16px 20px 0;border-bottom:1px solid var(--line);}
  nav button{background:none;border:none;padding:10px 14px;font-size:14px;font-family:'Inter';cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;}
  nav button.active{color:var(--ink);border-color:var(--good);font-weight:600;}
  main{padding:20px;max-width:720px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;}
  input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;font-size:14px;font-family:'Inter';background:var(--paper);}
  button.primary{margin-top:14px;width:100%;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;}
  .row{display:flex;justify-content:space-between;align-items:center;}
  .person-row{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .person-row:last-child{border-bottom:none;}
  .person-row:hover{background:var(--paper);}
  .person-name{font-weight:600;font-size:15px;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
  .remove-x{color:var(--bad);cursor:pointer;font-size:13px;background:none;border:none;}
  #loginScreen{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  #loginScreen .card{width:100%;max-width:320px;text-align:center;}
  #loginScreen h2{font-size:18px;margin-bottom:4px;}
  #loginScreen p{color:var(--muted);font-size:13px;margin:0 0 14px;}
  #loginError{color:var(--bad);font-size:12px;margin-top:8px;min-height:16px;}
  #confirmOverlay,#detailOverlay{position:fixed;inset:0;background:rgba(28,43,57,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
  #confirmOverlay.show,#detailOverlay.show{display:flex;}
  #confirmBox{background:var(--card);border-radius:12px;padding:20px;width:100%;max-width:320px;text-align:center;}
  #confirmBox h3{font-size:16px;margin-bottom:8px;}
  #confirmBox p{font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.5;}
  #confirmBtns{display:flex;gap:10px;}
  #confirmBtns button{flex:1;padding:11px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;}
  #confirmCancelBtn{background:none;border:1px solid var(--line);color:var(--ink);}
  #confirmOkBtn{background:var(--bad);border:none;color:#fff;}
  #detailOverlay{align-items:flex-end;}
  #detailBox{background:var(--card);border-radius:14px 14px 0 0;padding:18px;width:100%;max-width:480px;max-height:82vh;display:flex;flex-direction:column;}
  #detailBox h3{font-size:17px;}
  #detailCloseBtn{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;}
  #detailSummary{font-size:13px;color:var(--muted);margin-bottom:10px;}
  #detailEntries{overflow-y:auto;flex:1;}
  .detail-item{padding:10px 0;border-bottom:1px solid var(--line);}
  .detail-item:last-child{border-bottom:none;}
  .detail-item .top{font-size:14px;font-weight:600;}
  .detail-item .meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div id="loginScreen">
  <div class="card">
    <h2>Marketing Spend Tracker</h2>
    <p>Enter password to continue</p>
    <input type="password" id="loginPassword" placeholder="Password" autofocus>
    <button class="primary" onclick="tryLogin()">Enter</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="appWrap" style="display:none">

<header>
  <h1>Marketing Spend Tracker</h1>
  <p id="subtitle">Loading…</p>
</header>

<nav>
  <button data-tab="dashboard" class="active">Dashboard</button>
  <button data-tab="entry">Add Entry</button>
  <button data-tab="admin">Add Type</button>
  <button onclick="logout()" style="margin-left:auto;color:var(--bad);">Logout</button>
</nav>

<main>

  <section id="tab-dashboard">
    <div class="card">
      <label>Month</label>
      <input type="month" id="monthPicker">
    </div>
    <div class="card" id="dashboardList"><div class="empty">Loading…</div></div>
    <button class="primary" onclick="downloadExcel()">⬇ Download Excel (this month)</button>
  </section>

  <section id="tab-entry" style="display:none">
    <div class="card">
      <label>Date of Payment</label>
      <input type="date" id="fDate">
      <label>Marketing Person (Type)</label>
      <select id="fPerson"></select>
      <label>Amount (₹)</label>
      <input type="number" id="fAmount" placeholder="0">
      <label>Purpose Of Payment</label>
      <input type="text" id="fPurpose" placeholder="e.g. Advance payment - Nalgonda">
      <label>Account Holder</label>
      <input type="text" id="fAccountHolder" placeholder="e.g. LA EX EDU SERVICES PVT LTD">
      <label>Bank Account No</label>
      <input type="text" id="fBankAccountNo" placeholder="e.g. 50200111954407">
      <label>IFSC Code</label>
      <input type="text" id="fIfsc" placeholder="e.g. HDFC0000472">
      <label>Category</label>
      <input type="text" id="fCategory" placeholder="e.g. Marketing">
      <label>Sub Category</label>
      <input type="text" id="fSubCategory" placeholder="e.g. Individual Marketing">
      <label>Sub Type</label>
      <input type="text" id="fSubType" placeholder="e.g. Travel">
      <label>Branch</label>
      <input type="text" id="fBranch" placeholder="e.g. Mentora">
      <button class="primary" onclick="submitEntry()">Save Entry</button>
    </div>
  </section>

  <section id="tab-admin" style="display:none">
    <div class="card">
      <h3 style="font-size:14px;margin-bottom:8px;">Marketing Persons</h3>
      <div id="peopleList"><div class="empty">Loading…</div></div>
      <label>Add New Person</label>
      <input type="text" id="newPersonName" placeholder="Full name">
      <button class="primary" onclick="submitAddPerson()">Add Person</button>
    </div>
  </section>

</main>

<div id="confirmOverlay">
  <div id="confirmBox">
    <h3 id="confirmTitle">Are you sure?</h3>
    <p id="confirmMessage"></p>
    <div id="confirmBtns">
      <button id="confirmCancelBtn" onclick="closeConfirm()">Cancel</button>
      <button id="confirmOkBtn" onclick="acceptConfirm()">Remove</button>
    </div>
  </div>
</div>

<div id="detailOverlay">
  <div id="detailBox">
    <div class="row">
      <h3 id="detailName"></h3>
      <button id="detailCloseBtn" onclick="closeDetail()">✕</button>
    </div>
    <div id="detailSummary"></div>
    <div id="detailEntries"></div>
  </div>
</div>

</div>

<div class="toast" id="toast"></div>

<script>
// ---- Fixed config ----
const GAS_URL = 'https://script.google.com/macros/s/AKfycby44BTRR_cFlCYLKcsJ0s2aKkek9fI3qO7FoXRbtf1tUMoWRVSOeWy73xq83XvJTdCXDw/exec';
const APP_PASSWORD = 'admin529';
const SESSION_TIMEOUT_MS = 60 * 60 * 1000; // 1 hour
// -----------------------

let DATA = { entries: [], people: [] };
let confirmAction = null;

function tryLogin(){
  const val = document.getElementById('loginPassword').value;
  if(val === APP_PASSWORD){
    sessionStorage.setItem('loggedIn', '1');
    markActivity();
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appWrap').style.display = 'block';
    loadData();
  } else {
    document.getElementById('loginError').textContent = 'Incorrect password';
  }
}
function markActivity(){ sessionStorage.setItem('lastActivity', Date.now().toString()); }
function logout(){
  sessionStorage.removeItem('loggedIn');
  sessionStorage.removeItem('lastActivity');
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginPassword').value = '';
}
function isSessionValid(){
  if(sessionStorage.getItem('loggedIn') !== '1') return false;
  const last = Number(sessionStorage.getItem('lastActivity') || 0);
  return (Date.now() - last) < SESSION_TIMEOUT_MS;
}
['click','keydown','touchstart'].forEach(evt => {
  document.addEventListener(evt, () => { if(sessionStorage.getItem('loggedIn')==='1') markActivity(); });
});
setInterval(() => {
  if(sessionStorage.getItem('loggedIn') === '1' && !isSessionValid()){
    logout();
    toast('Logged out after 1 hour of inactivity');
  }
}, 30000);
document.getElementById('loginPassword').addEventListener('keydown', e => { if(e.key === 'Enter') tryLogin(); });
if(isSessionValid()){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appWrap').style.display = 'block';
}

const today = new Date();
const ymNow = today.toISOString().slice(0,7);
document.getElementById('monthPicker').value = ymNow;
document.getElementById('fDate').value = today.toISOString().slice(0,10);

document.querySelectorAll('nav button[data-tab]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button[data-tab]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('main section').forEach(s=>s.style.display='none');
    document.getElementById('tab-'+btn.dataset.tab).style.display='block';
  };
});

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

async function api(action, params){
  const url = new URL(GAS_URL);
  url.searchParams.set('action', action);
  Object.entries(params||{}).forEach(([k,v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString());
  const json = await res.json();
  if(json.error) throw new Error(json.error);
  return json;
}

async function loadData(){
  try{
    document.getElementById('subtitle').textContent = 'Syncing with Google Sheet…';
    DATA = await api('getData');
    document.getElementById('subtitle').textContent = 'Connected to Google Sheet';
    document.getElementById('fPerson').innerHTML = DATA.people.map(p=>`<option value="${p}">${p}</option>`).join('') || '<option value="">No people yet</option>';
    renderDashboard();
    renderPeopleList();
  }catch(e){
    document.getElementById('subtitle').textContent = 'Connection error: ' + e.message;
  }
}

function renderDashboard(){
  const month = document.getElementById('monthPicker').value;
  const el = document.getElementById('dashboardList');
  if(!DATA.people.length){ el.innerHTML = '<div class="empty">Add marketing persons in Admin tab first</div>'; return; }

  el.innerHTML = DATA.people.map(person=>{
    const used = DATA.entries
      .filter(e=>e.person===person && e.date && e.date.slice(0,7)===month)
      .reduce((s,e)=>s+e.amount,0);
    return `<div class="person-row" onclick="openDetail('${person}')">
      <div class="row"><span class="person-name">${person}</span><span style="font-weight:600;">₹${used}</span></div>
    </div>`;
  }).join('');
}

function openDetail(person){
  const month = document.getElementById('monthPicker').value;
  const list = DATA.entries
    .filter(e=>e.person===person && e.date && e.date.slice(0,7)===month)
    .sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  const total = list.reduce((s,e)=>s+e.amount,0);

  document.getElementById('detailName').textContent = person;
  document.getElementById('detailSummary').textContent = `${month} · Total given: ₹${total}`;
  document.getElementById('detailEntries').innerHTML = list.length ? list.map(e=>
    `<div class="detail-item">
      <div class="row"><span class="top">${e.date}</span><span class="top">₹${e.amount}</span></div>
      <div class="meta">${e.purpose || '—'}<br>${e.category} / ${e.subCategory} · ${e.subType} · ${e.branch}<br>${e.accountHolder} · ${e.bankAccountNo} · ${e.ifsc}</div>
    </div>`
  ).join('') : '<div class="empty">No entries for this person this month</div>';

  document.getElementById('detailOverlay').classList.add('show');
}
function closeDetail(){ document.getElementById('detailOverlay').classList.remove('show'); }

function renderPeopleList(){
  const el = document.getElementById('peopleList');
  el.innerHTML = DATA.people.length ? DATA.people.map(p=>
    `<div class="person-row row" style="cursor:default;"><span>${p}</span><button class="remove-x" onclick="removePerson('${p}')">Remove</button></div>`
  ).join('') : '<div class="empty">No marketing persons yet</div>';
}

async function submitEntry(){
  const payload = {
    date: document.getElementById('fDate').value,
    person: document.getElementById('fPerson').value,
    amount: document.getElementById('fAmount').value,
    purpose: document.getElementById('fPurpose').value,
    accountHolder: document.getElementById('fAccountHolder').value,
    bankAccountNo: document.getElementById('fBankAccountNo').value,
    ifsc: document.getElementById('fIfsc').value,
    category: document.getElementById('fCategory').value,
    subCategory: document.getElementById('fSubCategory').value,
    subType: document.getElementById('fSubType').value,
    branch: document.getElementById('fBranch').value
  };
  if(!payload.date || !payload.person || !payload.amount){ toast('Fill date, person and amount'); return; }
  await api('addEntry', payload);
  ['fAmount','fPurpose','fAccountHolder','fBankAccountNo','fIfsc','fCategory','fSubCategory','fSubType','fBranch'].forEach(id=>document.getElementById(id).value='');
  toast('Entry saved');
  loadData();
}

async function submitAddPerson(){
  const name = document.getElementById('newPersonName').value.trim();
  if(!name){ toast('Enter a name'); return; }
  await api('addPerson', {name});
  document.getElementById('newPersonName').value='';
  toast('Person added');
  loadData();
}

function askConfirm(message, onYes){
  document.getElementById('confirmMessage').textContent = message;
  confirmAction = onYes;
  document.getElementById('confirmOverlay').classList.add('show');
}
function closeConfirm(){
  document.getElementById('confirmOverlay').classList.remove('show');
  confirmAction = null;
}
async function acceptConfirm(){
  const action = confirmAction;
  closeConfirm();
  if(action) await action();
}
async function removePerson(name){
  askConfirm(`Remove "${name}"? Their past entries stay in the sheet, but they won't appear as an option for new entries.`, async () => {
    await api('removePerson', {name});
    toast('Removed');
    loadData();
  });
}

function downloadExcel(){
  const month = document.getElementById('monthPicker').value;
  const rows = DATA.entries.filter(e => e.date && e.date.slice(0,7) === month);
  if(!rows.length){ toast('No entries for this month'); return; }

  const header = ['Date of Payment','Account Holder','Bank Account No','Purpose Of Payment','Category','Sub Category','Type','Sub Type','Branch','IFSC Code','Amount'];
  const data = rows
    .sort((a,b)=> (a.date||'').localeCompare(b.date||''))
    .map(e => [e.date, e.accountHolder, e.bankAccountNo, e.purpose, e.category, e.subCategory, e.person, e.subType, e.branch, e.ifsc, e.amount]);

  const totals = {};
  rows.forEach(e => { totals[e.person] = (totals[e.person]||0) + Number(e.amount||0); });
  const grandTotal = Object.values(totals).reduce((a,b)=>a+b, 0);
  const summaryRows = Object.keys(totals).sort().map(p => [p, totals[p]]);
  summaryRows.push(['TOTAL', grandTotal]);
  const summarySheet = XLSX.utils.aoa_to_sheet([['Person','Total Amount'], ...summaryRows]);

  const sheet = XLSX.utils.aoa_to_sheet([header, ...data]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, summarySheet, 'Summary');
  XLSX.utils.book_append_sheet(wb, sheet, month);
  XLSX.writeFile(wb, `Marketing_Spend_${month}.xlsx`);
}

document.getElementById('monthPicker').addEventListener('change', renderDashboard);

if(isSessionValid()) loadData();
</script>
</body>
</html>
