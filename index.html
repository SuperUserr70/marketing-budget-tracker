<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Payment Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2B39; --paper:#F6F4EF; --card:#FFFFFF;
    --line:#DEDACE; --muted:#6B7280; --good:#3E7A5C; --warn:#C77B32; --bad:#B4483A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2,h3{font-family:'Source Serif 4',serif;margin:0;}
  header{padding:20px 20px 0;}
  header h1{font-size:22px;font-weight:700;}
  header p{color:var(--muted);font-size:13px;margin:4px 0 0;}
  nav{display:flex;gap:4px;padding:16px 20px 0;border-bottom:1px solid var(--line);overflow-x:auto;}
  nav button{white-space:nowrap;background:none;border:none;padding:10px 14px;font-size:14px;font-family:'Inter';cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;}
  nav button.active{color:var(--ink);border-color:var(--good);font-weight:600;}
  main{padding:20px;max-width:900px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;}
  input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;font-size:14px;font-family:'Inter';background:var(--paper);}
  button.primary{margin-top:14px;width:100%;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;}
  button.secondary{padding:8px 12px;background:none;border:1px solid var(--line);border-radius:7px;font-size:13px;cursor:pointer;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .person-row{padding:12px 0;border-bottom:1px solid var(--line);}
  .person-row:last-child{border-bottom:none;}
  .person-row.clickable{cursor:pointer;}
  .person-row.clickable:hover{background:var(--paper);}
  .person-name{font-weight:600;font-size:15px;}
  .stats{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;}
  .stats b{color:var(--ink);}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}
  .list-item{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .list-item:last-child{border-bottom:none;}
  .list-item .meta{color:var(--muted);}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:100;}
  .toast.show{opacity:1;}
  .remove-x{color:var(--bad);cursor:pointer;font-size:13px;background:none;border:none;}
  #loginScreen{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  #loginScreen .card{width:100%;max-width:320px;text-align:center;}
  #loginScreen h2{font-size:18px;margin-bottom:4px;}
  #loginScreen p{color:var(--muted);font-size:13px;margin:0 0 14px;}
  #loginError{color:var(--bad);font-size:12px;margin-top:8px;min-height:16px;}
  #confirmOverlay{position:fixed;inset:0;background:rgba(28,43,57,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
  #confirmOverlay.show{display:flex;}
  #confirmBox{background:var(--card);border-radius:12px;padding:20px;width:100%;max-width:320px;text-align:center;}
  #confirmBox h3{font-size:16px;margin-bottom:8px;}
  #confirmBox p{font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.5;}
  #confirmBtns{display:flex;gap:10px;}
  #confirmBtns button{flex:1;padding:11px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;}
  #confirmCancelBtn{background:none;border:1px solid var(--line);color:var(--ink);}
  #confirmOkBtn{background:var(--bad);border:none;color:#fff;}
  #detailOverlay{position:fixed;inset:0;background:rgba(28,43,57,.5);display:none;align-items:flex-end;justify-content:center;z-index:60;}
  #detailOverlay.show{display:flex;}
  #detailBox{background:var(--card);border-radius:14px 14px 0 0;padding:18px;width:100%;max-width:560px;max-height:85vh;display:flex;flex-direction:column;}
  #detailBox .row{margin-bottom:4px;}
  #detailBox h3{font-size:17px;}
  #detailCloseBtn{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;}
  #detailSummary{font-size:13px;color:var(--muted);margin-bottom:10px;}
  #detailEntries{overflow-y:auto;flex:1;}
  .detail-item{padding:10px 0;border-bottom:1px solid var(--line);}
  .detail-item:last-child{border-bottom:none;}
  .detail-item .row{font-size:14px;font-weight:600;}
  .detail-item .purpose{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4;}
  .detail-item .bank{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4;}
  .summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .summary-box{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--paper);}
  .summary-box .label{margin:0 0 4px;font-size:11px;}
  .summary-box .value{font-size:18px;font-weight:700;}
  .admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .admin-grid .card{margin-bottom:0;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  .monthly-total-row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;}
  .monthly-total-row:last-child{border-bottom:none;}
  .monthly-total-row strong{font-size:15px;}
  .monthly-total-row.selected{background:var(--paper);border-radius:7px;padding-left:10px;padding-right:10px;}
  .monthly-total-row.selected span{font-weight:600;}
  @media(max-width:650px){
    .admin-grid{grid-template-columns:1fr;}
    .field-grid{grid-template-columns:1fr;}
    .summary-grid{grid-template-columns:1fr 1fr;}
    main{padding:14px;}
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="card">
    <h2>Marketing Payment Tracker</h2>
    <p>Enter password to continue</p>
    <input type="password" id="loginPassword" placeholder="Password" autofocus>
    <button class="primary" onclick="tryLogin()">Enter</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="appWrap" style="display:none">

<header>
  <h1>Marketing Payment Tracker</h1>
  <p id="subtitle">Loading…</p>
</header>

<nav>
  <button data-tab="dashboard" class="active">Dashboard</button>
  <button data-tab="entry">Add Payment</button>
  <button data-tab="admin">Add Type (Marketing Person)</button>
  <button onclick="logout()" style="margin-left:auto;color:var(--bad);">Logout</button>
</nav>

<main>

  <!-- DASHBOARD -->
  <section id="tab-dashboard">
    <div class="card">
      <div class="row">
        <div style="flex:1;">
          <label>Month</label>
          <input type="month" id="monthPicker">
        </div>
      </div>
    </div>

    <div class="summary-grid" id="monthSummary" style="margin-bottom:14px;"></div>

    <div class="card" id="monthlyTotalsCard" style="margin-bottom:14px;">
      <div class="row" style="margin-bottom:10px;">
        <h3 style="font-size:15px;">Monthly Total Spent</h3>
        <span style="font-size:12px;color:var(--muted);">All recorded payments</span>
      </div>
      <div id="monthlyTotalsList"><div class="empty">Loading…</div></div>
    </div>

    <div class="card" id="dashboardList">
      <div class="empty">Loading…</div>
    </div>
  </section>

  <!-- ENTRY -->
  <section id="tab-entry" style="display:none">
    <div class="card">
      <h3 style="font-size:16px;margin-bottom:8px;">Add Payment</h3>

      <div class="field-grid">
        <div>
          <label>Date of Payment</label>
          <input type="date" id="entryDate">
        </div>

        <div>
          <label>Marketing Person (Type)</label>
          <select id="entryPerson"></select>
        </div>

        <div>
          <label>Account Holder</label>
          <input type="text" id="entryAccountHolder" placeholder="e.g. LA EX EDU SERVICES PVT LTD- PROJECT BV">
        </div>

        <div>
          <label>Bank Account No</label>
          <input type="text" id="entryBankAccountNo" placeholder="Account number">
        </div>

        <div>
          <label>IFSC Code</label>
          <input type="text" id="entryIfscCode" placeholder="e.g. HDFC0000472">
        </div>

        <div>
          <label>Amount (₹)</label>
          <input type="number" id="entryAmount" placeholder="0" min="0.01" step="0.01">
        </div>

        <div>
          <label>Category</label>
          <input type="text" id="entryCategory" placeholder="e.g. Marketing">
        </div>

        <div>
          <label>Sub Category</label>
          <input type="text" id="entrySubCategory" placeholder="e.g. Individual Marketing">
        </div>

        <div>
          <label>Sub Type</label>
          <input type="text" id="entrySubType" placeholder="e.g. Travel">
        </div>

        <div>
          <label>Branch</label>
          <input type="text" id="entryBranch" placeholder="e.g. Mentora">
        </div>
      </div>

      <label>Purpose Of Payment</label>
      <input type="text" id="entryPurpose" placeholder="e.g. Marketing person advance payment - Nalgonda">

      <button class="primary" onclick="submitEntry()">Save Payment</button>
    </div>

    <div class="card">
      <h3 style="font-size:14px;margin-bottom:8px;">Recent Payments</h3>
      <div id="recentEntries"><div class="empty">Loading…</div></div>
    </div>
  </section>

  <!-- ADD TYPE -->
  <section id="tab-admin">
    <div class="admin-grid">

      <div class="card">
        <h3 style="font-size:14px;margin-bottom:8px;">Add Type (Marketing Person)</h3>
        <div id="peopleList"><div class="empty">Loading…</div></div>
        <label>Add Marketing Person</label>
        <input type="text" id="newPersonName" placeholder="Full name">
        <button class="primary" onclick="submitAddPerson()">Add Person</button>
      </div>

    </div>
  </section>

</main>

<div id="confirmOverlay">
  <div id="confirmBox">
    <h3 id="confirmTitle">Are you sure?</h3>
    <p id="confirmMessage"></p>
    <div id="confirmBtns">
      <button id="confirmCancelBtn" onclick="closeConfirm()">Cancel</button>
      <button id="confirmOkBtn" onclick="acceptConfirm()">Remove</button>
    </div>
  </div>
</div>

<div id="detailOverlay">
  <div id="detailBox">
    <div class="row">
      <h3 id="detailName"></h3>
      <button id="detailCloseBtn" onclick="closeDetail()">✕</button>
    </div>
    <div id="detailSummary"></div>
    <div id="detailEntries"></div>
  </div>
</div>

</div>

<div class="toast" id="toast"></div>

<script>
// ---- Fixed config: edit these two lines for your setup ----
const GAS_URL = 'https://script.google.com/macros/s/AKfycby44BTRR_cFlCYLKcsJ0s2aKkek9fI3qO7FoXRbtf1tUMoWRVSOeWy73xq83XvJTdCXDw/exec';
const APP_PASSWORD = 'admin529';
// -------------------------------------------------------------

let DATA = { entries: [], people: [], subTypes: [], branches: [] };

const SESSION_TIMEOUT_MS = 60 * 60 * 1000;

function tryLogin(){
  const val = document.getElementById('loginPassword').value;
  if(val === APP_PASSWORD){
    sessionStorage.setItem('loggedIn', '1');
    markActivity();
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appWrap').style.display = 'block';
    loadData();
  } else {
    document.getElementById('loginError').textContent = 'Incorrect password';
  }
}

function markActivity(){
  sessionStorage.setItem('lastActivity', Date.now().toString());
}

function logout(){
  sessionStorage.removeItem('loggedIn');
  sessionStorage.removeItem('lastActivity');
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginPassword').value = '';
}

function isSessionValid(){
  if(sessionStorage.getItem('loggedIn') !== '1') return false;
  const last = Number(sessionStorage.getItem('lastActivity') || 0);
  return (Date.now() - last) < SESSION_TIMEOUT_MS;
}

['click','keydown','touchstart'].forEach(evt => {
  document.addEventListener(evt, () => {
    if(sessionStorage.getItem('loggedIn') === '1') markActivity();
  });
});

setInterval(() => {
  if(sessionStorage.getItem('loggedIn') === '1' && !isSessionValid()){
    logout();
    toast('Logged out after 1 hour of inactivity');
  }
}, 30000);

document.getElementById('loginPassword').addEventListener('keydown', e => {
  if(e.key === 'Enter') tryLogin();
});

const today = new Date();
const ymNow = today.toISOString().slice(0,7);
document.getElementById('monthPicker').value = ymNow;
document.getElementById('entryDate').value = today.toISOString().slice(0,10);

document.querySelectorAll('nav button[data-tab]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button[data-tab]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('main section').forEach(s => s.style.display='none');
    document.getElementById('tab-'+btn.dataset.tab).style.display='block';
  };
});

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function api(action, params){
  if(!GAS_URL || GAS_URL.indexOf('PASTE_YOUR') === 0){
    toast('Apps Script URL not set');
    throw new Error('no url');
  }

  const url = new URL(GAS_URL);
  url.searchParams.set('action', action);

  Object.entries(params || {}).forEach(([k,v]) => {
    url.searchParams.set(k, v);
  });

  // Prevent the browser/proxy from returning an older getData response.
  url.searchParams.set('_ts', Date.now().toString());
  const res = await fetch(url.toString(), { cache: 'no-store' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();

  if(json.error) throw new Error(json.error);
  return json;
}

async function loadData(){
  try{
    document.getElementById('subtitle').textContent = 'Syncing with Google Sheet…';

    DATA = await api('getData');

    document.getElementById('subtitle').textContent =
      `Connected · ${DATA.entries.length} payment${DATA.entries.length === 1 ? '' : 's'}`;

    if (DATA.entries.length === 0) {
      console.warn('Google Sheet returned zero payment entries. Make sure the deployed Apps Script version contains the new Entries-column mapping.');
    }

    populateDropdowns();
    renderDashboard();
    renderRecentEntries();
    renderAdminLists();
  }catch(e){
    document.getElementById('subtitle').textContent = 'Connection error: ' + e.message;
    toast(e.message);
  }
}

function fillSelect(id, values, emptyText){
  const sel = document.getElementById(id);

  if(!values || !values.length){
    sel.innerHTML = `<option value="">${emptyText}</option>`;
    return;
  }

  sel.innerHTML =
    '<option value="">Select…</option>' +
    values.map(v =>
      `<option value="${escapeHtmlAttr(v)}">${escapeHtml(v)}</option>`
    ).join('');
}

function populateDropdowns(){
  fillSelect('entryPerson', DATA.people, 'No marketing persons');
}

function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function escapeHtmlAttr(value){
  return escapeHtml(value);
}

function getMonthEntries(month){
  return DATA.entries.filter(e =>
    e.date && e.date.slice(0,7) === month
  );
}

function renderMonthlyTotals(){
  const el = document.getElementById('monthlyTotalsList');
  const totals = {};

  DATA.entries.forEach(e => {
    const month = e.date ? String(e.date).slice(0,7) : '';
    if(!/^\d{4}-\d{2}$/.test(month)) return;
    totals[month] = (totals[month] || 0) + Number(e.amount || 0);
  });

  const months = Object.keys(totals).sort((a,b) => b.localeCompare(a));

  if(!months.length){
    el.innerHTML = '<div class="empty">No payment data available</div>';
    return;
  }

  el.innerHTML = months.map(month => {
    const [year, monthNo] = month.split('-');
    const label = new Date(Number(year), Number(monthNo)-1, 1)
      .toLocaleDateString('en-IN', {month:'long', year:'numeric'});
    const selected = month === document.getElementById('monthPicker').value;

    return `
      <div class="monthly-total-row ${selected ? 'selected' : ''}" onclick="selectDashboardMonth('${month}')">
        <span>${label}</span>
        <strong>₹${formatMoney(totals[month])}</strong>
      </div>
    `;
  }).join('');
}

function selectDashboardMonth(month){
  document.getElementById('monthPicker').value = month;
  renderDashboard();
}

function renderDashboard(){
  const month = document.getElementById('monthPicker').value;
  const monthEntries = getMonthEntries(month);

  const total = monthEntries.reduce((s,e) => s + Number(e.amount || 0), 0);
  const peopleWithPayments = new Set(monthEntries.map(e => e.person).filter(Boolean)).size;

  document.getElementById('monthSummary').innerHTML = `
    <div class="summary-box">
      <div class="label">TOTAL PAID</div>
      <div class="value">₹${formatMoney(total)}</div>
    </div>
    <div class="summary-box">
      <div class="label">MARKETING PERSONS PAID</div>
      <div class="value">${peopleWithPayments}</div>
    </div>
  `;

  renderMonthlyTotals();

  const el = document.getElementById('dashboardList');

  if(!DATA.people.length){
    el.innerHTML = '<div class="empty">Add marketing persons in Admin first</div>';
    return;
  }

  el.innerHTML = DATA.people.map(person => {
    const list = monthEntries.filter(e => e.person === person);
    const used = list.reduce((s,e) => s + Number(e.amount || 0), 0);

    return `
      <div class="person-row clickable" onclick="openDetail('${escapeJs(person)}')">
        <div class="row">
          <span class="person-name">${escapeHtml(person)}</span>
          <span style="font-size:13px;color:var(--muted)">
            ${list.length} payment${list.length === 1 ? '' : 's'}
          </span>
        </div>
        <div class="stats">
          <span>Given / Spent</span>
          <span><b>₹${formatMoney(used)}</b></span>
        </div>
      </div>
    `;
  }).join('');

  // Also show entries for people who were removed later, so historical data
  // is not silently hidden.
  const currentNames = new Set(DATA.people);
  const historicalPeople = [...new Set(monthEntries.map(e => e.person).filter(Boolean))]
    .filter(p => !currentNames.has(p));

  if(historicalPeople.length){
    el.innerHTML += `
      <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);">
        Historical / removed persons
      </div>
      ${historicalPeople.map(person => {
        const used = monthEntries
          .filter(e => e.person === person)
          .reduce((s,e) => s + Number(e.amount || 0), 0);

        return `
          <div class="person-row clickable" onclick="openDetail('${escapeJs(person)}')">
            <div class="row">
              <span class="person-name">${escapeHtml(person)}</span>
              <span style="font-size:13px;color:var(--muted)">Removed</span>
            </div>
            <div class="stats">
              <span>Given / Spent</span>
              <span><b>₹${formatMoney(used)}</b></span>
            </div>
          </div>
        `;
      }).join('')}
    `;
  }
}

function formatMoney(value){
  return Number(value || 0).toLocaleString('en-IN', {
    minimumFractionDigits: 0,
    maximumFractionDigits: 2
  });
}

function escapeJs(value){
  return String(value ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

function openDetail(person){
  const month = document.getElementById('monthPicker').value;

  const list = DATA.entries
    .filter(e => e.person === person && e.date && e.date.slice(0,7) === month)
    .sort((a,b) => (b.date || '').localeCompare(a.date || ''));

  const used = list.reduce((s,e) => s + Number(e.amount || 0), 0);

  document.getElementById('detailName').textContent = person;
  document.getElementById('detailSummary').textContent =
    `${month} · ${list.length} payment${list.length === 1 ? '' : 's'} · Total ₹${formatMoney(used)}`;

  document.getElementById('detailEntries').innerHTML = list.length ? list.map(e => `
    <div class="detail-item">
      <div class="row">
        <span>${escapeHtml(e.date)}</span>
        <span>₹${formatMoney(e.amount)}</span>
      </div>
      <div class="purpose">
        ${escapeHtml(e.purpose || 'No purpose noted')}
      </div>
      <div class="bank">
        ${escapeHtml(e.accountHolder)} · A/C ${escapeHtml(e.bankAccountNo)} · ${escapeHtml(e.ifscCode)}
        <br>
        ${escapeHtml(e.category)} / ${escapeHtml(e.subCategory)}
        · ${escapeHtml(e.subType)} · ${escapeHtml(e.branch)}
      </div>
    </div>
  `).join('') : '<div class="empty">No payments for this person this month</div>';

  document.getElementById('detailOverlay').classList.add('show');
}

function closeDetail(){
  document.getElementById('detailOverlay').classList.remove('show');
}

function renderRecentEntries(){
  const el = document.getElementById('recentEntries');

  const list = [...DATA.entries]
    .sort((a,b) => (b.date || '').localeCompare(a.date || ''))
    .slice(0,10);

  el.innerHTML = list.length ? list.map(e => `
    <div class="list-item">
      <span>
        ${escapeHtml(e.date)} · ${escapeHtml(e.person)}
        <div class="meta">
          ${escapeHtml(e.purpose || '—')} · ${escapeHtml(e.branch || '—')}
        </div>
      </span>
      <span>₹${formatMoney(e.amount)}</span>
    </div>
  `).join('') : '<div class="empty">No payments yet</div>';
}

function renderAdminLists(){
  renderSimpleList('peopleList', DATA.people, removePerson, 'No marketing persons');
}

function renderSimpleList(id, values, removeFn, emptyText){
  const el = document.getElementById(id);

  if(!values.length){
    el.innerHTML = `<div class="empty">${emptyText}</div>`;
    return;
  }

  el.innerHTML = values.map(v => `
    <div class="person-row row">
      <span>${escapeHtml(v)}</span>
      <button class="remove-x" onclick="window.${removeFn.name}('${escapeJs(v)}')">Remove</button>
    </div>
  `).join('');
}

async function submitEntry(){
  const params = {
    date: document.getElementById('entryDate').value,
    person: document.getElementById('entryPerson').value,
    accountHolder: document.getElementById('entryAccountHolder').value.trim(),
    bankAccountNo: document.getElementById('entryBankAccountNo').value.trim(),
    ifscCode: document.getElementById('entryIfscCode').value.trim(),
    amount: document.getElementById('entryAmount').value,
    purpose: document.getElementById('entryPurpose').value.trim(),
    category: document.getElementById('entryCategory').value.trim(),
    subCategory: document.getElementById('entrySubCategory').value.trim(),
    subType: document.getElementById('entrySubType').value,
    branch: document.getElementById('entryBranch').value
  };

  const required = [
    ['date', 'Date of payment'],
    ['person', 'Marketing person'],
    ['accountHolder', 'Account holder'],
    ['bankAccountNo', 'Bank account number'],
    ['ifscCode', 'IFSC code'],
    ['amount', 'Amount'],
    ['purpose', 'Purpose'],
    ['category', 'Category'],
    ['subCategory', 'Sub category'],
    ['subType', 'Sub type'],
    ['branch', 'Branch']
  ];

  for(const [key,label] of required){
    if(!params[key]){
      toast(`Fill: ${label}`);
      return;
    }
  }

  try{
    await api('addEntry', params);

    document.getElementById('entryAmount').value = '';
    document.getElementById('entryPurpose').value = '';
    document.getElementById('entryCategory').value = '';
    document.getElementById('entrySubCategory').value = '';

    toast('Payment saved');
    await loadData();
  }catch(e){
    toast(e.message);
  }
}

async function submitAddPerson(){
  await addAdminValue('newPersonName', 'addPerson', 'Person added');
}


async function addAdminValue(inputId, action, successMessage){
  const input = document.getElementById(inputId);
  const name = input.value.trim();

  if(!name){
    toast('Enter a name');
    return;
  }

  try{
    await api(action, {name});
    input.value = '';
    toast(successMessage);
    await loadData();
  }catch(e){
    toast(e.message);
  }
}

let confirmAction = null;

function askConfirm(message, onYes){
  document.getElementById('confirmMessage').textContent = message;
  confirmAction = onYes;
  document.getElementById('confirmOverlay').classList.add('show');
}

function closeConfirm(){
  document.getElementById('confirmOverlay').classList.remove('show');
  confirmAction = null;
}

async function acceptConfirm(){
  const action = confirmAction;
  closeConfirm();
  if(action){
    try{
      await action();
    }catch(e){
      toast(e.message);
    }
  }
}

function removePerson(name){
  askConfirm(
    `Remove "${name}" from the marketing-person dropdown? Existing payments remain in the sheet.`,
    async () => {
      await api('removePerson', {name});
      toast('Person removed');
      await loadData();
    }
  );
}


document.getElementById('monthPicker').addEventListener('change', renderDashboard);

if(isSessionValid()){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appWrap').style.display = 'block';
  loadData();
}
</script>
