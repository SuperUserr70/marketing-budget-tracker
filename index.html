<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Spend Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1C2B39;
    --paper:#F6F4EF;
    --card:#FFFFFF;
    --line:#DEDACE;
    --muted:#6B7280;
    --good:#3E7A5C;
    --warn:#C77B32;
    --bad:#B4483A;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
  }

  h1,h2,h3{
    font-family:'Source Serif 4',serif;
    margin:0;
  }

  header{
    padding:20px 20px 0;
  }

  header h1{
    font-size:22px;
    font-weight:700;
  }

  header p{
    color:var(--muted);
    font-size:13px;
    margin:4px 0 0;
  }

  nav{
    display:flex;
    gap:4px;
    padding:16px 20px 0;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }

  nav button{
    background:none;
    border:none;
    padding:10px 14px;
    font-size:14px;
    font-family:'Inter';
    cursor:pointer;
    color:var(--muted);
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }

  nav button.active{
    color:var(--ink);
    border-color:var(--good);
    font-weight:600;
  }

  main{
    padding:20px;
    max-width:720px;
    margin:0 auto;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
  }

  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin:10px 0 4px;
  }

  input,
  select{
    width:100%;
    padding:10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:14px;
    font-family:'Inter';
    background:var(--paper);
    color:var(--ink);
  }

  input:focus,
  select:focus{
    outline:none;
    border-color:var(--good);
  }

  button.primary{
    margin-top:14px;
    width:100%;
    padding:12px;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:7px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }

  button.primary:disabled{
    opacity:.6;
    cursor:not-allowed;
  }

  .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .person-row{
    padding:14px 0;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }

  .person-row:last-child{
    border-bottom:none;
  }

  .person-row:hover{
    background:var(--paper);
  }

  .person-name{
    font-weight:600;
    font-size:15px;
  }

  .empty{
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:20px 0;
  }

  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    font-size:13px;
    opacity:0;
    transition:opacity .25s;
    pointer-events:none;
    z-index:100;
  }

  .toast.show{
    opacity:1;
  }

  .remove-x{
    color:var(--bad);
    cursor:pointer;
    font-size:13px;
    background:none;
    border:none;
  }

  /* =========================
     LOGIN
     ========================= */

  #loginScreen{
    position:fixed;
    inset:0;
    background:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }

  #loginScreen .card{
    width:100%;
    max-width:320px;
    text-align:center;
  }

  #loginScreen h2{
    font-size:18px;
    margin-bottom:4px;
  }

  #loginScreen p{
    color:var(--muted);
    font-size:13px;
    margin:0 0 14px;
  }

  #loginError{
    color:var(--bad);
    font-size:12px;
    margin-top:8px;
    min-height:16px;
  }

  /* =========================
     OVERLAYS
     ========================= */

  #confirmOverlay,
  #detailOverlay{
    position:fixed;
    inset:0;
    background:rgba(28,43,57,.5);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:60;
    padding:20px;
  }

  #confirmOverlay.show,
  #detailOverlay.show{
    display:flex;
  }

  /* =========================
     CONFIRM ENTRY
     ========================= */

  #confirmBox{
    background:var(--card);
    border-radius:14px;
    width:100%;
    max-width:430px;
    max-height:88vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .confirm-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }

  .confirm-header h3{
    font-size:20px;
    margin:0;
  }

  .confirm-close{
    background:none;
    border:none;
    font-size:24px;
    color:var(--muted);
    cursor:pointer;
    padding:0 2px;
    line-height:1;
  }

  #confirmDetails{
    padding:8px 20px;
    overflow-y:auto;
    flex:1;
  }

  .confirm-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:18px;
    padding:11px 0;
    border-bottom:1px solid #EEEEEE;
  }

  .confirm-row:last-child{
    border-bottom:none;
  }

  .confirm-label{
    color:var(--muted);
    font-size:12px;
    line-height:1.4;
    flex:0 0 43%;
  }

  .confirm-value{
    color:var(--ink);
    font-size:13px;
    font-weight:500;
    text-align:right;
    line-height:1.4;
    word-break:break-word;
    flex:1;
  }

  .confirm-amount{
    font-size:18px;
    font-weight:700;
  }

  .confirm-actions{
    display:flex;
    gap:10px;
    padding:14px 20px 18px;
    border-top:1px solid var(--line);
    flex-shrink:0;
  }

  .confirm-actions button{
    flex:1;
    padding:12px;
    border-radius:7px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }

  #confirmEditBtn{
    background:#fff;
    border:1px solid var(--line);
    color:var(--ink);
  }

  #confirmSaveBtn{
    background:var(--ink);
    border:1px solid var(--ink);
    color:#fff;
  }

  #confirmSaveBtn:disabled{
    opacity:.6;
    cursor:not-allowed;
  }

  /* =========================
     DETAIL
     ========================= */

  #detailOverlay{
    align-items:flex-end;
  }

  #detailBox{
    background:var(--card);
    border-radius:14px 14px 0 0;
    padding:18px;
    width:100%;
    max-width:480px;
    max-height:82vh;
    display:flex;
    flex-direction:column;
  }

  #detailBox h3{
    font-size:17px;
  }

  #detailCloseBtn{
    background:none;
    border:none;
    font-size:20px;
    color:var(--muted);
    cursor:pointer;
    line-height:1;
  }

  #detailSummary{
    font-size:13px;
    color:var(--muted);
    margin-bottom:10px;
  }

  #detailEntries{
    overflow-y:auto;
    flex:1;
  }

  .detail-item{
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }

  .detail-item:last-child{
    border-bottom:none;
  }

  .detail-item .top{
    font-size:14px;
    font-weight:600;
  }

  .detail-item .meta{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
    line-height:1.5;
  }

  /* =========================
     MOBILE
     ========================= */

  @media(max-width:480px){

    main{
      padding:14px;
    }

    header{
      padding:18px 16px 0;
    }

    nav{
      padding-left:10px;
      padding-right:10px;
    }

    nav button{
      padding:10px 11px;
      font-size:13px;
    }

    #confirmOverlay{
      padding:12px;
    }

    #confirmBox{
      max-height:90vh;
    }

    .confirm-header{
      padding:16px;
    }

    #confirmDetails{
      padding:6px 16px;
    }

    .confirm-actions{
      padding:12px 16px 16px;
    }

    .confirm-label{
      flex-basis:45%;
    }
  }
</style>
</head>

<body>

<!-- =========================
     LOGIN
     ========================= -->

<div id="loginScreen">

  <div class="card">

    <h2>Marketing Spend Tracker</h2>

    <p>Enter password to continue</p>

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
      autofocus
    >

    <button class="primary" onclick="tryLogin()">
      Enter
    </button>

    <div id="loginError"></div>

  </div>

</div>


<!-- =========================
     MAIN APP
     ========================= -->

<div id="appWrap" style="display:none">

  <header>

    <h1>Marketing Spend Tracker</h1>

    <p id="subtitle">
      Loading…
    </p>

  </header>


  <!-- NAVIGATION -->

  <nav>

    <button
      data-tab="dashboard"
      class="active">
      Dashboard
    </button>

    <button
      data-tab="entry">
      Add Entry
    </button>

    <button
      data-tab="admin">
      Admin
    </button>

    <button
      onclick="logout()"
      style="margin-left:auto;color:var(--bad);">
      Logout
    </button>

  </nav>


  <main>

    <!-- =========================
         DASHBOARD
         ========================= -->

    <section id="tab-dashboard">

      <div class="card">

        <label>
          Month
        </label>

        <input
          type="month"
          id="monthPicker"
        >

      </div>


      <div
        class="card"
        id="dashboardList">

        <div class="empty">
          Loading…
        </div>

      </div>

    </section>


    <!-- =========================
         ADD ENTRY
         ========================= -->

    <section
      id="tab-entry"
      style="display:none">

      <div class="card">

        <label>
          Date of Payment
        </label>

        <input
          type="date"
          id="fDate"
        >


        <label>
          Marketing Person (Type)
        </label>

        <select id="fPerson"></select>


        <label>
          Amount (₹)
        </label>

        <input
          type="number"
          id="fAmount"
          placeholder="0"
          min="0"
        >


        <label>
          Purpose Of Payment
        </label>

        <input
          type="text"
          id="fPurpose"
          placeholder="e.g. Advance payment - Nalgonda"
        >


        <label>
          Account Holder
        </label>

        <input
          type="text"
          id="fAccountHolder"
          placeholder="e.g. LA EX EDU SERVICES PVT LTD"
        >


        <label>
          Bank Account No
        </label>

        <input
          type="text"
          id="fBankAccountNo"
          placeholder="e.g. 50200111954407"
        >


        <label>
          IFSC Code
        </label>

        <input
          type="text"
          id="fIfsc"
          placeholder="e.g. HDFC0000472"
        >


        <label>
          Category
        </label>

        <input
          type="text"
          id="fCategory"
          placeholder="e.g. Marketing"
        >


        <label>
          Sub Category
        </label>

        <input
          type="text"
          id="fSubCategory"
          placeholder="e.g. Individual Marketing"
        >


        <label>
          Sub Type
        </label>

        <input
          type="text"
          id="fSubType"
          placeholder="e.g. Travel"
        >


        <label>
          Branch
        </label>

        <input
          type="text"
          id="fBranch"
          placeholder="e.g. Mentora"
        >


        <button
          class="primary"
          onclick="submitEntry()">
          Save Entry
        </button>

      </div>

    </section>


    <!-- =========================
         ADMIN
         ========================= -->

    <section
      id="tab-admin"
      style="display:none">

      <div class="card">

        <h3
          style="font-size:14px;margin-bottom:8px;">
          Marketing Persons
        </h3>


        <div id="peopleList">

          <div class="empty">
            Loading…
          </div>

        </div>


        <label>
          Add New Person
        </label>

        <input
          type="text"
          id="newPersonName"
          placeholder="Full name"
        >


        <button
          class="primary"
          onclick="submitAddPerson()">
          Add Person
        </button>

      </div>

    </section>

  </main>


  <!-- =========================
       CONFIRM ENTRY OVERLAY
       ========================= -->

  <div id="confirmOverlay">

    <div id="confirmBox">

      <div class="confirm-header">

        <h3>
          Confirm Entry
        </h3>

        <button
          class="confirm-close"
          onclick="closeConfirm()"
          aria-label="Close">
          ✕
        </button>

      </div>


      <div id="confirmDetails"></div>


      <div class="confirm-actions">

        <button
          id="confirmEditBtn"
          onclick="closeConfirm()">
          Edit
        </button>

        <button
          id="confirmSaveBtn"
          onclick="acceptConfirm()">
          Confirm &amp; Save
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       REMOVE PERSON CONFIRMATION
       ========================= -->

  <div id="removeConfirmOverlay"
       style="
       position:fixed;
       inset:0;
       background:rgba(28,43,57,.5);
       display:none;
       align-items:center;
       justify-content:center;
       z-index:70;
       padding:20px;">

    <div
      style="
      background:var(--card);
      border-radius:12px;
      padding:20px;
      width:100%;
      max-width:340px;">

      <h3
        style="font-size:17px;margin-bottom:8px;">
        Remove Person?
      </h3>

      <p
        id="removeConfirmMessage"
        style="
        font-size:13px;
        color:var(--muted);
        margin:0 0 18px;
        line-height:1.5;">
      </p>

      <div
        style="display:flex;gap:10px;">

        <button
          onclick="closeRemoveConfirm()"
          style="
          flex:1;
          padding:11px;
          border-radius:7px;
          background:#fff;
          border:1px solid var(--line);
          font-weight:600;
          cursor:pointer;">
          Cancel
        </button>

        <button
          id="removeConfirmBtn"
          onclick="acceptRemoveConfirm()"
          style="
          flex:1;
          padding:11px;
          border-radius:7px;
          background:var(--bad);
          border:none;
          color:#fff;
          font-weight:600;
          cursor:pointer;">
          Remove
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       DETAIL OVERLAY
       ========================= -->

  <div id="detailOverlay">

    <div id="detailBox">

      <div class="row">

        <h3 id="detailName"></h3>

        <button
          id="detailCloseBtn"
          onclick="closeDetail()">
          ✕
        </button>

      </div>


      <div id="detailSummary"></div>


      <div id="detailEntries"></div>

    </div>

  </div>

</div>


<!-- TOAST -->

<div
  class="toast"
  id="toast">
</div>


<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const GAS_URL =
'https://script.google.com/macros/s/AKfycby44BTRR_cFlCYLKcsJ0s2aKkek9fI3qO7FoXRbtf1tUMoWRVSOeWy73xq83XvJTdCXDw/exec';

const APP_PASSWORD = 'admin529';

const SESSION_TIMEOUT_MS =
60 * 60 * 1000;


/* =========================================================
   GLOBAL DATA
   ========================================================= */

let DATA = {
  entries: [],
  people: []
};

let pendingEntry = null;

let removeConfirmAction = null;


/* =========================================================
   LOGIN
   ========================================================= */

function tryLogin(){

  const val =
    document.getElementById('loginPassword').value;

  if(val === APP_PASSWORD){

    sessionStorage.setItem(
      'loggedIn',
      '1'
    );

    markActivity();

    document.getElementById(
      'loginScreen'
    ).style.display = 'none';

    document.getElementById(
      'appWrap'
    ).style.display = 'block';

    loadData();

  }else{

    document.getElementById(
      'loginError'
    ).textContent =
      'Incorrect password';

  }
}


function markActivity(){

  sessionStorage.setItem(
    'lastActivity',
    Date.now().toString()
  );

}


function logout(){

  sessionStorage.removeItem('loggedIn');

  sessionStorage.removeItem('lastActivity');

  document.getElementById(
    'appWrap'
  ).style.display = 'none';

  document.getElementById(
    'loginScreen'
  ).style.display = 'flex';

  document.getElementById(
    'loginPassword'
  ).value = '';

}


function isSessionValid(){

  if(
    sessionStorage.getItem('loggedIn')
    !== '1'
  ){
    return false;
  }

  const last =
    Number(
      sessionStorage.getItem(
        'lastActivity'
      ) || 0
    );

  return (
    Date.now() - last
  ) < SESSION_TIMEOUT_MS;

}


['click','keydown','touchstart'].forEach(
  evt => {

    document.addEventListener(
      evt,
      () => {

        if(
          sessionStorage.getItem(
            'loggedIn'
          ) === '1'
        ){

          markActivity();

        }

      }
    );

  }
);


setInterval(
  () => {

    if(
      sessionStorage.getItem(
        'loggedIn'
      ) === '1'
      &&
      !isSessionValid()
    ){

      logout();

      toast(
        'Logged out after 1 hour of inactivity'
      );

    }

  },
  30000
);


document
  .getElementById('loginPassword')
  .addEventListener(
    'keydown',
    e => {

      if(e.key === 'Enter'){
        tryLogin();
      }

    }
  );


/* =========================================================
   INITIAL DATE
   ========================================================= */

const today = new Date();

const ymNow =
  today.toISOString().slice(0,7);

document.getElementById(
  'monthPicker'
).value = ymNow;

document.getElementById(
  'fDate'
).value =
  today.toISOString().slice(0,10);


/* =========================================================
   NAVIGATION
   ========================================================= */

document
  .querySelectorAll(
    'nav button[data-tab]'
  )
  .forEach(btn => {

    btn.onclick = () => {

      document
        .querySelectorAll(
          'nav button[data-tab]'
        )
        .forEach(
          b =>
            b.classList.remove(
              'active'
            )
        );

      btn.classList.add('active');

      document
        .querySelectorAll(
          'main section'
        )
        .forEach(
          s =>
            s.style.display =
              'none'
        );

      document.getElementById(
        'tab-' + btn.dataset.tab
      ).style.display = 'block';

    };

  });


/* =========================================================
   TOAST
   ========================================================= */

function toast(msg){

  const t =
    document.getElementById('toast');

  t.textContent = msg;

  t.classList.add('show');

  setTimeout(
    () =>
      t.classList.remove('show'),
    2200
  );

}


/* =========================================================
   API
   ========================================================= */

async function api(
  action,
  params
){

  const url =
    new URL(GAS_URL);

  url.searchParams.set(
    'action',
    action
  );

  Object.entries(
    params || {}
  ).forEach(
    ([k,v]) =>
      url.searchParams.set(
        k,
        v
      )
  );

  const res =
    await fetch(
      url.toString()
    );

  const json =
    await res.json();

  if(json.error){

    throw new Error(
      json.error
    );

  }

  return json;

}


/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadData(){

  try{

    document.getElementById(
      'subtitle'
    ).textContent =
      'Syncing with Google Sheet…';


    DATA =
      await api('getData');


    document.getElementById(
      'subtitle'
    ).textContent =
      'Connected to Google Sheet';


    document.getElementById(
      'fPerson'
    ).innerHTML =
      DATA.people
        .map(
          p =>
            `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`
        )
        .join('')
      ||
      '<option value="">No people yet</option>';


    renderDashboard();

    renderPeopleList();

  }catch(e){

    document.getElementById(
      'subtitle'
    ).textContent =
      'Connection error: ' +
      e.message;

  }

}


/* =========================================================
   DASHBOARD
   ========================================================= */

function renderDashboard(){

  const month =
    document.getElementById(
      'monthPicker'
    ).value;

  const el =
    document.getElementById(
      'dashboardList'
    );


  if(!DATA.people.length){

    el.innerHTML =
      '<div class="empty">Add marketing persons in Admin tab first</div>';

    return;

  }


  el.innerHTML =
    DATA.people
      .map(person => {

        const used =
          DATA.entries
            .filter(
              e =>
                e.person === person
                &&
                e.date
                &&
                e.date.slice(0,7)
                  === month
            )
            .reduce(
              (s,e) =>
                s + Number(e.amount || 0),
              0
            );


        return `
          <div
            class="person-row"
            onclick="openDetail('${escapeJs(person)}')">

            <div class="row">

              <span class="person-name">
                ${escapeHtml(person)}
              </span>

              <span style="font-weight:600;">
                ₹${used.toLocaleString('en-IN')}
              </span>

            </div>

          </div>
        `;

      })
      .join('');

}


/* =========================================================
   PERSON DETAIL
   ========================================================= */

function openDetail(person){

  const month =
    document.getElementById(
      'monthPicker'
    ).value;


  const list =
    DATA.entries
      .filter(
        e =>
          e.person === person
          &&
          e.date
          &&
          e.date.slice(0,7)
            === month
      )
      .sort(
        (a,b) =>
          (b.date || '')
            .localeCompare(
              a.date || ''
            )
      );


  const total =
    list.reduce(
      (s,e) =>
        s + Number(e.amount || 0),
      0
    );


  document.getElementById(
    'detailName'
  ).textContent =
    person;


  document.getElementById(
    'detailSummary'
  ).textContent =
    `${month} · Total given: ₹${total.toLocaleString('en-IN')}`;


  document.getElementById(
    'detailEntries'
  ).innerHTML =

    list.length

    ?

    list.map(
      e => `

        <div class="detail-item">

          <div class="row">

            <span class="top">
              ${escapeHtml(e.date)}
            </span>

            <span class="top">
              ₹${Number(e.amount || 0).toLocaleString('en-IN')}
            </span>

          </div>

          <div class="meta">

            ${escapeHtml(e.purpose || '—')}
            <br>

            ${escapeHtml(e.category || '—')}
            /
            ${escapeHtml(e.subCategory || '—')}
            ·
            ${escapeHtml(e.subType || '—')}
            ·
            ${escapeHtml(e.branch || '—')}

            <br>

            ${escapeHtml(e.accountHolder || '—')}
            ·
            ${escapeHtml(e.bankAccountNo || '—')}
            ·
            ${escapeHtml(e.ifsc || '—')}

          </div>

        </div>

      `
    ).join('')

    :

    '<div class="empty">No entries for this person this month</div>';


  document
    .getElementById(
      'detailOverlay'
    )
    .classList.add('show');

}


function closeDetail(){

  document
    .getElementById(
      'detailOverlay'
    )
    .classList.remove('show');

}


/* =========================================================
   PEOPLE LIST
   ========================================================= */

function renderPeopleList(){

  const el =
    document.getElementById(
      'peopleList'
    );


  el.innerHTML =

    DATA.people.length

    ?

    DATA.people.map(
      p => `

        <div
          class="person-row row"
          style="cursor:default;">

          <span>
            ${escapeHtml(p)}
          </span>

          <button
            class="remove-x"
            onclick="removePerson('${escapeJs(p)}')">

            Remove

          </button>

        </div>

      `
    ).join('')

    :

    '<div class="empty">No marketing persons yet</div>';

}


/* =========================================================
   ADD ENTRY
   ========================================================= */

function submitEntry(){

  const payload = {

    date:
      document.getElementById(
        'fDate'
      ).value,

    person:
      document.getElementById(
        'fPerson'
      ).value,

    amount:
      document.getElementById(
        'fAmount'
      ).value,

    purpose:
      document.getElementById(
        'fPurpose'
      ).value,

    accountHolder:
      document.getElementById(
        'fAccountHolder'
      ).value,

    bankAccountNo:
      document.getElementById(
        'fBankAccountNo'
      ).value,

    ifsc:
      document.getElementById(
        'fIfsc'
      ).value,

    category:
      document.getElementById(
        'fCategory'
      ).value,

    subCategory:
      document.getElementById(
        'fSubCategory'
      ).value,

    subType:
      document.getElementById(
        'fSubType'
      ).value,

    branch:
      document.getElementById(
        'fBranch'
      ).value

  };


  if(
    !payload.date
    ||
    !payload.person
    ||
    !payload.amount
  ){

    toast(
      'Fill date, person and amount'
    );

    return;

  }


  if(
    Number(payload.amount) <= 0
  ){

    toast(
      'Amount must be greater than 0'
    );

    return;

  }


  /* Save temporarily until user confirms */

  pendingEntry = payload;


  /* Build confirmation */

  const details = [

    [
      'Date of Payment',
      payload.date
    ],

    [
      'Marketing Person',
      payload.person
    ],

    [
      'Amount',
      '₹' +
      Number(
        payload.amount
      ).toLocaleString('en-IN'),
      true
    ],

    [
      'Purpose of Payment',
      payload.purpose || '—'
    ],

    [
      'Account Holder',
      payload.accountHolder || '—'
    ],

    [
      'Bank Account No',
      payload.bankAccountNo || '—'
    ],

    [
      'IFSC Code',
      payload.ifsc || '—'
    ],

    [
      'Category',
      payload.category || '—'
    ],

    [
      'Sub Category',
      payload.subCategory || '—'
    ],

    [
      'Sub Type',
      payload.subType || '—'
    ],

    [
      'Branch',
      payload.branch || '—'
    ]

  ];


  document.getElementById(
    'confirmDetails'
  ).innerHTML =

    details
      .map(
        ([label,value,isAmount]) => `

          <div class="confirm-row">

            <div class="confirm-label">
              ${escapeHtml(label)}
            </div>

            <div
              class="confirm-value
              ${isAmount ? 'confirm-amount' : ''}">

              ${escapeHtml(value)}

            </div>

          </div>

        `
      )
      .join('');


  document
    .getElementById(
      'confirmOverlay'
    )
    .classList.add('show');

}


/* =========================================================
   CONFIRM & SAVE
   ========================================================= */

async function acceptConfirm(){

  if(!pendingEntry){
    return;
  }


  const payload =
    pendingEntry;


  const saveBtn =
    document.getElementById(
      'confirmSaveBtn'
    );


  saveBtn.disabled = true;

  saveBtn.textContent =
    'Saving...';


  try{

    await api(
      'addEntry',
      payload
    );


    /* Clear form */

    [
      'fAmount',
      'fPurpose',
      'fAccountHolder',
      'fBankAccountNo',
      'fIfsc',
      'fCategory',
      'fSubCategory',
      'fSubType',
      'fBranch'
    ].forEach(
      id => {

        document.getElementById(
          id
        ).value = '';

      }
    );


    pendingEntry = null;


    closeConfirm();


    saveBtn.disabled = false;

    saveBtn.textContent =
      'Confirm & Save';


    toast(
      'Entry saved successfully'
    );


    /*
       IMPORTANT:
       Reload Google Sheet data before
       rendering dashboard.
    */

    await loadData();


    /*
       Go directly to Dashboard
       after saving.
    */

    document
      .querySelector(
        'nav button[data-tab="dashboard"]'
      )
      .click();


    /*
       Explicitly render again after
       fresh data is loaded.
    */

    renderDashboard();


  }catch(e){

    saveBtn.disabled = false;

    saveBtn.textContent =
      'Confirm & Save';


    toast(
      'Failed to save: ' +
      e.message
    );

  }

}


/* =========================================================
   CLOSE ENTRY CONFIRMATION
   ========================================================= */

function closeConfirm(){

  document
    .getElementById(
      'confirmOverlay'
    )
    .classList.remove('show');

}


/* =========================================================
   ADD PERSON
   ========================================================= */

async function submitAddPerson(){

  const name =
    document
      .getElementById(
        'newPersonName'
      )
      .value
      .trim();


  if(!name){

    toast(
      'Enter a name'
    );

    return;

  }


  try{

    await api(
      'addPerson',
      {
        name:name
      }
    );


    document
      .getElementById(
        'newPersonName'
      )
      .value = '';


    toast(
      'Person added'
    );


    await loadData();


  }catch(e){

    toast(
      'Failed to add person: ' +
      e.message
    );

  }

}


/* =========================================================
   REMOVE PERSON
   ========================================================= */

function removePerson(name){

  removeConfirmAction =
    async () => {

      try{

        await api(
          'removePerson',
          {
            name:name
          }
        );


        toast(
          'Removed'
        );


        await loadData();


      }catch(e){

        toast(
          'Failed to remove: ' +
          e.message
        );

      }

    };


  document.getElementById(
    'removeConfirmMessage'
  ).textContent =

    `Remove "${name}"? Their past entries will stay in the sheet, but they won't appear as an option for new entries.`;


  document.getElementById(
    'removeConfirmOverlay'
  ).style.display =
    'flex';

}


function closeRemoveConfirm(){

  document.getElementById(
    'removeConfirmOverlay'
  ).style.display =
    'none';

  removeConfirmAction = null;

}


async function acceptRemoveConfirm(){

  const action =
    removeConfirmAction;

  closeRemoveConfirm();

  if(action){

    await action();

  }

}


/* =========================================================
   HTML ESCAPING
   ========================================================= */

function escapeHtml(value){

  return String(value)
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/* =========================================================
   JAVASCRIPT STRING ESCAPING
   ========================================================= */

function escapeJs(value){

  return String(value)
    .replace(
      /\\/g,
      '\\\\'
    )
    .replace(
      /'/g,
      "\\'"
    );

}


/* =========================================================
   MONTH CHANGE
   ========================================================= */

document
  .getElementById(
    'monthPicker'
  )
  .addEventListener(
    'change',
    renderDashboard
  );


/* =========================================================
   CLOSE OVERLAYS WHEN CLICKING BACKDROP
   ========================================================= */

document
  .getElementById(
    'confirmOverlay'
  )
  .addEventListener(
    'click',
    e => {

      if(
        e.target.id ===
        'confirmOverlay'
      ){

        closeConfirm();

      }

    }
  );


document
  .getElementById(
    'detailOverlay'
  )
  .addEventListener(
    'click',
    e => {

      if(
        e.target.id ===
        'detailOverlay'
      ){

        closeDetail();

      }

    }
  );


/* =========================================================
   START APPLICATION
   ========================================================= */

if(isSessionValid()){

  document.getElementById(
    'loginScreen'
  ).style.display =
    'none';

  document.getElementById(
    'appWrap'
  ).style.display =
    'block';

  loadData();

}
